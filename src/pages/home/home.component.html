<div class="course-panel">
  <h3>All courses:</h3>

  <button class="btn">Add course</button>

  <mat-tab-group>
    <mat-tab label="Beginners">
      <app-course-card-list
        [courses]="beginnersCourses()"
        (courseUpdated)="onCourseUpdated($event)"
      />
    </mat-tab>

    <mat-tab label="Advanced">
      <app-course-card-list [courses]="advancedCourses()" />
    </mat-tab>
  </mat-tab-group>
</div>

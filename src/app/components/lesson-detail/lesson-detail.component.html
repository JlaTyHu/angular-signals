<div class="lesson-detail">
  <h1>Edit Lesson</h1>

  <div class="form-control edit-lesson">
    <label for="lessonDescription">Lesson title:</label>

    <input
      #lessonDescription
      id="lessonDescription"
      placeholder="Enter course title"
      [value]="lesson()?.description"
    />
  </div>
</div>

<div class="form-actions">
  <button class="btn" (click)="onSave(lessonDescription.value)"> Save </button>

  <button class="btn" (click)="onCancel()"> Cancel </button>
</div>
